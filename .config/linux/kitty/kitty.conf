# Rikoo kitty terminal config
# Mirrors the shared Alacritty styling (font / theme / transparency / padding),
# used on the aarch64 niri session where alacritty 0.18.0-dev corrupts glyphs at
# scaled outputs. kitty is self-contained (no external theme import).

font_family          MesloLGS Nerd Font Mono
bold_font            auto
italic_font          auto
bold_italic_font     auto
font_size            13.0
adjust_line_height   0

# Match Alacritty's window.linux.toml: no decorations, 12px padding.
# background_opacity 1.0（完全不透）：aarch64 mtgpu 驱动对半透明背景的 alpha 合成
# 有 bug，会把 0.82 的背景错误渲染成"全透明、看不清字体"，故改为 1.0 走不透明路径。
hide_window_decorations  yes
window_padding_width     12
background_opacity       1.0
dynamic_background_opacity no

# Match Alacritty's scrollback history (50000 lines).
scrollback_lines  50000
# Align with Alacritty's scrolling.multiplier = 3 (lines per wheel step).
wheel_scroll_multiplier 3.0
# Community common: page the scrollback through less (Ctrl+Shift+H opens the
# last scrolled line, Ctrl+Shift+G closes the pager) instead of the built-in.
scrollback_pager less --clear-screen -R
# Community common: enable split/stack layouts in addition to kitty's default
# tall layout, so Ctrl+Shift+Enter opens a new window beside the current one.
# (enabled_layouts is comma-separated, unlike most kitty options.)
enabled_layouts tall,splits,stack

# Beam cursor with blinking, like Alacritty.
cursor_shape           beam
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0

# Mirror Alacritty's hide_when_typing=true. kitty 0.32.2 默认 mouse_hide_wait=0.0
# （不隐藏），需显式 -3 才能在打字时隐藏鼠标。
mouse_hide_wait -3

# Align with Alacritty's terminal.osc52 = "OnlyCopy": only allow copying from
# the terminal to the clipboard, never pasting out of it via OSC52.
clipboard_control write-clipboard write-primary

# Catppuccin Mocha palette (same theme as AwesomeWM / fuzzel / waybar).
background            #1e1e2e
foreground            #cdd6f4
selection_background  #585b70
selection_foreground  #cdd6f4
url_color             #f38ba8
cursor                #f5e0dc
cursor_text_color     #1e1e2e
active_border_color   #b4befe
inactive_border_color #6c7086
bell_border_color     #f9e2af
tab_bar_style         fade
tab_fade              0.25

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8
color16 #fab387
color17 #f5c2e7

# Mirror Alacritty keys.linux.toml bindings (Alt -> Neovim / tmux navigation).
# tmux-style pane switching (Alt+hjkl -> Ctrl-a hjkl).
map alt+h send_text all \x01h
map alt+j send_text all \x01j
map alt+k send_text all \x01k
map alt+l send_text all \x01l

# Neovim Alt+Arrow navigation (xterm-style modifier sequences).
map alt+left  send_text all \x1b[1;3D
map alt+right send_text all \x1b[1;3C
map alt+up    send_text all \x1b[1;3A
map alt+down  send_text all \x1b[1;3B
map shift+alt+up   send_text all \x1b[1;4A
map shift+alt+down send_text all \x1b[1;4B

# NOTE: TERM intentionally left as kitty's default. Unlike Alacritty (which sets
# xterm-256color for remote terminfo compatibility), kitty's own terminal type
# enables the kitty keyboard protocol and graphics capabilities.
