# Rikoo foot terminal config
# Mirrors the shared Alacritty styling (font / theme / transparency / padding),
# used as the Wayland fallback when Alacritty is unavailable. foot is
# self-contained (no external theme import).

[main]
term=xterm-256color
# font-* 都显式带 :size=12，避免 foot 对 font-bold/italic/bold-italic
# 回退到默认 size=8 导致粗体/斜体字号与常规字体不一致。
# aarch64 内屏 2x HiDPI 下 12 比 13 显示更紧凑。
font=MesloLGS Nerd Font Mono:size=12
font-bold=MesloLGS Nerd Font Mono:weight=bold:size=12
font-italic=MesloLGS Nerd Font Mono:slant=italic:size=12
font-bold-italic=MesloLGS Nerd Font Mono:weight=bold:slant=italic:size=12
pad=12x12
initial-window-mode=windowed

[scrollback]
# Match Alacritty's scrolling.history = 50000.
lines=50000
# Align with Alacritty's scrolling.multiplier = 3.
multiplier=3.0

[cursor]
# Beam + blinking, like Alacritty.
style=beam
blink=yes

[mouse]
# Mirror Alacritty's hide_when_typing = true.
hide-when-typing=yes

[csd]
# Mirror Alacritty's decorations = "none".
preferred=none

[colors]
# Match Alacritty's window.linux.toml opacity = 0.82.
alpha=0.82
foreground=cdd6f4
background=1e1e2e
# Catppuccin Mocha cursor colors (text then cursor). Alacritty 走主题默认反转；
# foot 显式对齐 Catppuccin Mocha 主题。foot 1.25 起 colors.cursor 取代 cursor.color。
cursor=1e1e2e f5e0dc
selection-foreground=cdd6f4
selection-background=585b70

# Catppuccin Mocha palette (same theme as AwesomeWM / fuzzel / waybar / kitty).
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8

# Extended 256-color palette: Catppuccin Mocha orange (16) and pink (17).
16=fab387
17=f5c2e7

# URL underline color matches Alacritty/kitty url_color (#f38ba8).
urls=f38ba8

[text-bindings]
# Mirror Alacritty's keys.linux.toml bindings (Alt -> Neovim / tmux navigation).
# foot 要求 modifier 用 XKB 名称：Alt 对应 Mod1（Mod2/Mod3/Mod4/Mod5 分别对应
# NumLock/ScrollLock/Level5/Super，不能用 "Alt" 字面量）。
# tmux-style pane switching (Mod1+hjkl -> Ctrl-a hjkl).
\x01h = Mod1+h
\x01j = Mod1+j
\x01k = Mod1+k
\x01l = Mod1+l

# Neovim Alt+Arrow navigation (xterm-style modifier sequences).
\x1b[1;3D = Mod1+Left
\x1b[1;3C = Mod1+Right
\x1b[1;3A = Mod1+Up
\x1b[1;3B = Mod1+Down
\x1b[1;4A = Shift+Mod1+Up
\x1b[1;4B = Shift+Mod1+Down

# NOTE: OSC52 默认仅允许写剪贴板方向（foot 默认 clipboard_control 行为），
# 与 Alacritty 的 terminal.osc52 = "OnlyCopy" 等价，无需显式配置。
