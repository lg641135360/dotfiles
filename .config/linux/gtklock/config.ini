[main]
# gtklock 配置（glib key file 格式，所有选项都在 [main] 组）。
# 背景壁纸由 lock-wayland 用 --background 命令行传入（复用当前壁纸），
# style 路径也由 lock-wayland 用 --style 传入绝对路径，避免相对路径歧义。
gtk-theme=Adwaita-dark
time-format=%H:%M
date-format=%A %m月%d日
# 双屏输入表单定位（2026-09-01）：gtklock 输入框只显示在一块屏上，而 niri 锁屏
# 键盘焦点跟随指针——表单与指针不同屏时按键落空（曾必须挪鼠标到副屏才能输密码）。
# monitor-priority 按序钉主屏：x64 命中 DP-1，aarch64 无 DP-1 落 eDP-1，一份配置
# 跨机器。注意必须用单行 `;` 列表（glib key file 同名 key 重复写只保留最后一条，
# gtklock 经 g_key_file_get_string_list 读取，man 页的"可多次指定"指命令行 -M）。
# follow-focus 让表单跟随指针跨屏（man 注明 "may not work for all compositors"），
# 若 niri 上表现异常（表单跳动/不生效）则删除本行、仅保留 monitor-priority。
monitor-priority=DP-1;eDP-1
follow-focus=true
