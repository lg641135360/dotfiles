[main]
font=Noto Sans CJK SC:size=13
terminal=~/.config/scripts/terminal-wayland
prompt=应用 >
icons-enabled=no
icon-theme=Papirus-Dark
lines=14
width=58
horizontal-pad=24
vertical-pad=18
inner-pad=12
image-size-ratio=0.42
line-height=28
fields=name,generic,comment,categories,filename,keywords
dpi-aware=auto
layer=overlay
filter-desktop=yes
show-actions=yes

[colors]
background=15161dee
text=d9e0eeff
match=f9e2afff
selection=89b4faff
selection-text=1e1e2eff
selection-match=f9e2afff
border=94e2d5ff

[border]
radius=10
width=2
